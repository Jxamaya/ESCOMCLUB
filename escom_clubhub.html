<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel para transpilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Estilos básicos para ocultar scrollbars estéticamente */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const CATEGORIES = ['Tecnología', 'Programación', 'Ciencia', 'Robótica', 'Videojuegos', 'Cultura', 'Deportes', 'Emprendimiento'];

        {

            members: 45,
            status: 'active',
            founder: 'Diego Torres',
            schedule: 'Jueves, 12:00 - 14:00',
            location: 'Auditorio',
            logo: '🚀',
            cover: 'https://images.unsplash.com/photo-1556761175-4b46a572b786?auto=format&fit=crop&q=80&w=1000',
            tags: ['Startup', 'Negocios', 'Pitch']
        }
        ];

        const MOCK_EVENTS = [
        { id: 'e1', title: 'Torneo Interno de Sumobots', clubId: 'c1', date: '2026-09-15', time: '10:00', location: 'Plaza Central ESCOM' },
        { id: 'e2', title: 'Taller Introducción a PyTorch', clubId: 'c2', date: '2026-09-18', time: '15:00', location: 'Aula 104' },
        { id: 'e3', title: 'Game Jam ESCOM 2026', clubId: 'c3', date: '2026-09-25', time: '09:00', location: 'Lab. Cómputo Avanzado' },
        ];

        const Icons = {
        Search: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>,
        Users: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>,
        Calendar: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>,
        MapPin: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>,
        ChevronRight: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>,
        Plus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>,
        Bell: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>,
        Menu: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>,
        Settings: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>,
        Check: () => <svg className="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>,
        X: () => <svg className="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        };

        const Button = ({ children, variant = 'primary', className = '', ...props }) => {
        const baseStyle = "inline-flex items-center justify-center px-4 py-2 font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2";
        const variants = {
            primary: "bg-[#0056B3] text-white hover:bg-[#003d82] focus:ring-[#0056B3]",
            secondary: "bg-[#7A1C47] text-white hover:bg-[#5c1535] focus:ring-[#7A1C47]",
            outline: "border-2 border-[#0056B3] text-[#0056B3] hover:bg-blue-50 focus:ring-[#0056B3]",
            ghost: "text-gray-600 hover:bg-gray-100 focus:ring-gray-500"
        };
        
        return (
            <button className={`${baseStyle} ${variants[variant]} ${className}`} {...props}>
            {children}
            </button>
        );
        };

        const Badge = ({ children, color = 'blue' }) => {
        const colors = {
            blue: "bg-blue-100 text-[#0056B3]",
            red: "bg-red-100 text-[#7A1C47]",
            green: "bg-green-100 text-green-800",
            gray: "bg-gray-100 text-gray-800"
        };
        return (
            <span className={`px-2.5 py-0.5 rounded-full text-xs font-medium ${colors[color]}`}>
            {children}
            </span>
        );
        };

        const Card = ({ children, className = '' }) => (
        <div className={`bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition-shadow ${className}`}>
            {children}
        </div>
        );

        const Modal = ({ isOpen, onClose, title, children }) => {
        if (!isOpen) return null;
        return (
            <div className="fixed inset-0 z-50 flex items-center justify-center overflow-x-hidden overflow-y-auto outline-none focus:outline-none">
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm" onClick={onClose}></div>
            <div className="relative w-full max-w-lg mx-auto my-6 z-50 p-4">
                <div className="bg-white rounded-2xl shadow-xl flex flex-col w-full outline-none focus:outline-none">
                <div className="flex items-start justify-between p-5 border-b border-solid border-gray-200 rounded-t">
                    <h3 className="text-xl font-bold text-gray-900">{title}</h3>
                    <button className="p-1 ml-auto bg-transparent border-0 text-gray-400 hover:text-gray-900 float-right text-3xl leading-none font-semibold outline-none focus:outline-none" onClick={onClose}>
                    <span className="block h-6 w-6 text-2xl outline-none focus:outline-none">×</span>
                    </button>
                </div>
                <div className="relative p-6 flex-auto">
                    {children}
                </div>
                </div>
            </div>
            </div>
        );
        };

        const LandingPage = ({ navigate }) => {
        return (
            <div className="flex flex-col min-h-screen">
            <section className="relative bg-[#0056B3] text-white py-24 overflow-hidden">
                <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&q=80&w=2000')] bg-cover bg-center mix-blend-overlay opacity-20"></div>
                <div className="container mx-auto px-6 relative z-10 text-center max-w-4xl">
                <h1 className="text-4xl md:text-6xl font-extrabold mb-6 tracking-tight">
                    Encuentra tu comunidad en <span className="text-[#FBBF24]">ESCOM</span>
                </h1>
                <p className="text-lg md:text-2xl mb-10 text-blue-100 max-w-2xl mx-auto">
                    Descubre, crea y participa en los clubes estudiantiles. Conecta con estudiantes que comparten tus intereses.
                </p>
                <div className="flex flex-col sm:flex-row items-center justify-center gap-4">
                    <Button variant="secondary" className="w-full sm:w-auto text-lg px-8 py-3" onClick={() => navigate('/clubs')}>
                    Explorar clubes
                    </Button>
                    <Button variant="outline" className="w-full sm:w-auto text-lg px-8 py-3 bg-transparent border-white text-white hover:bg-white hover:text-[#0056B3]" onClick={() => navigate('/create-club')}>
                    Crear un club
                    </Button>
                </div>
                </div>
            </section>

            <section className="py-20 bg-gray-50">
                <div className="container mx-auto px-6">
                <div className="flex justify-between items-end mb-12">
                    <div>
                    <h2 className="text-3xl font-bold text-gray-900 mb-2">Clubes Destacados</h2>
                    <p className="text-gray-600">Comunidades con mayor actividad reciente.</p>
                    </div>
                    <Button variant="ghost" onClick={() => navigate('/clubs')} className="hidden sm:flex">
                    Ver todos <Icons.ChevronRight />
                    </Button>
                </div>
                
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    {MOCK_CLUBS.slice(0, 3).map(club => (
                    <ClubCard key={club.id} club={club} onClick={() => navigate(`/clubs/${club.id}`)} />
                    ))}
                </div>
                </div>
            </section>

            <section className="py-20 bg-white">
                <div className="container mx-auto px-6">
                <h2 className="text-3xl font-bold text-center text-gray-900 mb-12">Explora por Intereses</h2>
                <div className="flex flex-wrap justify-center gap-4 max-w-4xl mx-auto">
                    {CATEGORIES.map(cat => (
                    <button key={cat} className="px-6 py-3 bg-gray-100 hover:bg-blue-50 hover:text-[#0056B3] text-gray-700 font-medium rounded-full transition-colors">
                        {cat}
                    </button>
                    ))}
                </div>
                </div>
            </section>
            
            <section className="py-16 bg-[#7A1C47] text-white text-center">
                <div className="container mx-auto px-6">
                <h2 className="text-3xl font-bold mb-4">¿No encuentras el club que buscas?</h2>
                <p className="text-xl mb-8 opacity-90">Tú puedes ser el fundador de la próxima gran comunidad en ESCOM.</p>
                <Button variant="outline" className="border-white text-white hover:bg-white hover:text-[#7A1C47]" onClick={() => navigate('/create-club')}>
                    Inicia un nuevo club hoy
                </Button>
                </div>
            </section>
            </div>
        );
        };

        const ExploreClubs = ({ navigate }) => {
        const [searchTerm, setSearchTerm] = useState('');
        const [activeCategory, setActiveCategory] = useState('Todos');

        const filteredClubs = useMemo(() => {
            return MOCK_CLUBS.filter(club => {
            const matchesSearch = club.name.toLowerCase().includes(searchTerm.toLowerCase()) || club.description.toLowerCase().includes(searchTerm.toLowerCase());
            const matchesCategory = activeCategory === 'Todos' || club.category === activeCategory;
            return matchesSearch && matchesCategory;
            });
        }, [searchTerm, activeCategory]);

        return (
            <div className="min-h-screen bg-gray-50 py-12">
            <div className="container mx-auto px-6">
                <div className="mb-10">
                <h1 className="text-3xl font-bold text-gray-900 mb-4">Explorar Clubes</h1>
                
                <div className="flex flex-col md:flex-row gap-4">
                    <div className="relative flex-grow">
                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <Icons.Search />
                    </div>
                    <input
                        type="text"
                        className="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl leading-5 bg-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#0056B3] focus:border-[#0056B3]"
                        placeholder="Buscar por nombre, palabra clave..."
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                    />
                    </div>
                    
                    <div className="flex items-center overflow-x-auto pb-2 md:pb-0 gap-2 hide-scrollbar">
                    <button 
                        className={`px-4 py-2 rounded-xl whitespace-nowrap font-medium transition-colors ${activeCategory === 'Todos' ? 'bg-[#0056B3] text-white' : 'bg-white text-gray-600 border border-gray-300 hover:bg-gray-50'}`}
                        onClick={() => setActiveCategory('Todos')}
                    >
                        Todos
                    </button>
                    {CATEGORIES.map(cat => (
                        <button 
                        key={cat}
                        className={`px-4 py-2 rounded-xl whitespace-nowrap font-medium transition-colors ${activeCategory === cat ? 'bg-[#0056B3] text-white' : 'bg-white text-gray-600 border border-gray-300 hover:bg-gray-50'}`}
                        onClick={() => setActiveCategory(cat)}
                    >
                        {cat}
                    </button>
                    ))}
                    </div>
                </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                {filteredClubs.length > 0 ? (
                    filteredClubs.map(club => (
                    <ClubCard key={club.id} club={club} onClick={() => navigate(`/clubs/${club.id}`)} />
                    ))
                ) : (
                    <div className="col-span-full py-20 text-center text-gray-500">
                    <p className="text-xl mb-4">No se encontraron clubes que coincidan con tu búsqueda.</p>
                    <Button variant="outline" onClick={() => { setSearchTerm(''); setActiveCategory('Todos'); }}>Limpiar filtros</Button>
                    </div>
                )}
                </div>
            </div>
            </div>
        );
        };

        const ClubCard = ({ club, onClick }) => (
        <Card className="cursor-pointer group flex flex-col h-full">
            <div className="h-48 overflow-hidden relative">
            <img src={club.cover} alt={club.name} className="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" />
            <div className="absolute top-4 left-4">
                <Badge color={club.category === 'Tecnología' || club.category === 'Programación' ? 'blue' : 'red'}>
                {club.category}
                </Badge>
            </div>
            </div>
            <div className="p-6 flex flex-col flex-grow">
            <div className="flex items-center gap-3 mb-3">
                <span className="text-3xl">{club.logo}</span>
                <h3 className="text-xl font-bold text-gray-900 group-hover:text-[#0056B3] transition-colors line-clamp-1">{club.name}</h3>
            </div>
            <p className="text-gray-600 mb-4 line-clamp-3 text-sm flex-grow">{club.description}</p>
            
            <div className="mt-auto pt-4 border-t border-gray-100 flex items-center justify-between text-sm text-gray-500">
                <div className="flex items-center gap-1">
                <Icons.Users /> {club.members}
                </div>
                <div className="flex items-center gap-1 text-[#0056B3] font-medium">
                Ver detalles <Icons.ChevronRight />
                </div>
            </div>
            </div>
        </Card>
        );

        const ClubDetail = ({ id, navigate }) => {
        const club = MOCK_CLUBS.find(c => c.id === id);
        const [isJoinModalOpen, setJoinModalOpen] = useState(false);
        const [joinStatus, setJoinStatus] = useState('idle'); 

        if (!club) return <div className="text-center py-20">Club no encontrado</div>;

        const handleJoinSubmit = (e) => {
            e.preventDefault();
            setJoinStatus('loading');
            setTimeout(() => {
            setJoinStatus('success');
            setTimeout(() => setJoinModalOpen(false), 2000);
            }, 1500);
        };

        return (
            <div className="bg-gray-50 min-h-screen">
            <div className="h-64 md:h-80 w-full relative">
                <img src={club.cover} alt="Cover" className="w-full h-full object-cover" />
                <div className="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
                <div className="absolute bottom-0 left-0 w-full p-6 md:p-12 text-white">
                <div className="container mx-auto flex flex-col md:flex-row md:items-end justify-between gap-6">
                    <div className="flex items-center gap-4">
                    <div className="text-5xl bg-white p-3 rounded-2xl shadow-lg">{club.logo}</div>
                    <div>
                        <Badge color="blue">{club.category}</Badge>
                        <h1 className="text-3xl md:text-5xl font-bold mt-2 mb-1">{club.name}</h1>
                        <p className="opacity-90 flex items-center gap-2">Fundado por {club.founder} • <Icons.Users /> {club.members} miembros</p>
                    </div>
                    </div>
                    <Button variant="primary" className="bg-[#7A1C47] hover:bg-[#5c1535] text-white font-bold text-lg px-8 py-3 shadow-lg" onClick={() => {setJoinModalOpen(true); setJoinStatus('idle');}}>
                    Solicitar Unirse
                    </Button>
                </div>
                </div>
            </div>

            <div className="container mx-auto px-6 py-12">
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <div className="lg:col-span-2 space-y-8">
                    <Card className="p-8">
                    <h2 className="text-2xl font-bold text-gray-900 mb-4">Acerca del club</h2>
                    <p className="text-gray-700 leading-relaxed text-lg whitespace-pre-line">{club.description}</p>
                    
                    <div className="mt-8 flex flex-wrap gap-2">
                        {club.tags.map(tag => (
                        <span key={tag} className="px-3 py-1 bg-gray-100 text-gray-600 rounded-full text-sm font-medium">#{tag}</span>
                        ))}
                    </div>
                    </Card>

                    <Card className="p-8">
                    <h2 className="text-2xl font-bold text-gray-900 mb-6">Próximos Eventos</h2>
                    <div className="space-y-4">
                        {MOCK_EVENTS.filter(e => e.clubId === club.id).length > 0 ? (
                        MOCK_EVENTS.filter(e => e.clubId === club.id).map(event => (
                            <div key={event.id} className="flex gap-4 p-4 border border-gray-100 rounded-xl hover:bg-gray-50 transition-colors">
                            <div className="flex flex-col items-center justify-center bg-blue-50 text-[#0056B3] rounded-lg p-3 min-w-[80px]">
                                <span className="text-sm font-bold uppercase">{new Date(event.date).toLocaleDateString('es-ES', { month: 'short' })}</span>
                                <span className="text-2xl font-black">{new Date(event.date).getDate()}</span>
                            </div>
                            <div>
                                <h4 className="font-bold text-lg text-gray-900">{event.title}</h4>
                                <div className="text-gray-500 text-sm mt-1 flex flex-col sm:flex-row gap-2 sm:gap-4">
                                <span className="flex items-center gap-1"><Icons.Calendar /> {event.time}</span>
                                <span className="flex items-center gap-1"><Icons.MapPin /> {event.location}</span>
                                </div>
                            </div>
                            </div>
                        ))
                        ) : (
                        <p className="text-gray-500 italic">No hay eventos próximos programados.</p>
                        )}
                    </div>
                    </Card>
                </div>

                <div className="space-y-8">
                    <Card className="p-6">
                    <h3 className="text-lg font-bold text-gray-900 mb-4 border-b pb-2">Información Práctica</h3>
                    <ul className="space-y-4">
                        <li className="flex items-start gap-3 text-gray-700">
                        <div className="mt-1 text-[#0056B3]"><Icons.Calendar /></div>
